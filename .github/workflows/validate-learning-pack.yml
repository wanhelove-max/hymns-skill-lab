name: Validate Learning Packs

on:
  pull_request:
    paths:
      - "community/**"
      - "examples/**"
      - "scripts/**"
      - "schemas/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run validate
